name: Colixo SEO Agent v2

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pull-request-ci:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout SEO agent
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install v2 dependencies
        run: pip install -r requirements-v2.txt

      - name: Run tests
        run: pytest -q

      - name: Compile Python sources
        run: >-
          python -m py_compile
          scripts/gsc_client.py
          scripts/seo_agent_v2.py
          scripts/run_seo_pipeline.py
          scripts/push_to_site_repo.py

      - name: Check patch whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha }}..HEAD"

      - name: Verify production publishing remains disabled
        run: |
          if python scripts/push_to_site_repo.py; then
            echo "Production publishing guard unexpectedly succeeded"
            exit 1
          fi

  monitor-analyse-propose:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout SEO agent
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install v2 dependencies
        run: pip install -r requirements-v2.txt

      - name: Run tests
        run: pytest -q

      - name: Monitor Search Console and technical SEO
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_PROPERTY: sc-domain:colixo.ch
        run: python scripts/seo_agent_v2.py

      - name: Upload SEO report
        uses: actions/upload-artifact@v4
        with:
          name: colixo-seo-report
          path: |
            reports/latest.md
            reports/latest.json
          retention-days: 30

      - name: Publish report to SEO tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = '[SEO Agent] Suivi hebdomadaire Colixo';
            const report = fs.readFileSync('reports/latest.md', 'utf8');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            let issue = issues.find(i => !i.pull_request && i.title === title);
            if (!issue) {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: 'Rapports automatiques du Colixo SEO Agent v2. Le bot observe, analyse et propose; il ne publie rien sur le site.'
              });
              issue = created.data;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: report.slice(0, 65000)
            });
