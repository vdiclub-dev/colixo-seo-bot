name: Colixo SEO Agent V3 GA4 Read-only Probe

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  ga4-readonly-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout SEO agent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install GA4 Data API dependency
        run: python -m pip install --requirement requirements.txt

      - name: Authenticate to Google Cloud with keyless WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/270376484474/locations/global/workloadIdentityPools/github/providers/colixo-seo-bot
          service_account: colixo-seo-ga4-reader@colixo-seo-agent.iam.gserviceaccount.com
          project_id: colixo-seo-agent
          create_credentials_file: true
          export_environment_variables: true

      - name: Run one GA4 read-only report
        run: python -m scripts.v3.ga4_readonly_probe
